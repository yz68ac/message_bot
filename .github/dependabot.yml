version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
# No uv entry: Dependabot reads the pinned requirements*.txt exports as manifests and
# edits them without updating uv.lock, so its PRs always fail the dependency check.
# Update Python packages by hand: uv lock --upgrade, then python scripts/dependencies.py.
